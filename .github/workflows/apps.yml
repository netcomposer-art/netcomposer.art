name: Instruments on one origin

# The /synth/, /rhythm/ and /bass/ builds: file checks (tests/apps.test.mjs) and the
# one-origin browser check (tests/one-origin.e2e.mjs). Read-only; no secrets.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: apps.test
        run: node --test tests/apps.test.mjs
      - name: Playwright 1.56.1 + Chromium (outside the repo)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: one-origin e2e
        run: node tests/one-origin.e2e.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
