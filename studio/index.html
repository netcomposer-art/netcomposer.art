<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NetComposer Studio</title>
    <meta name="description" content="NetComposer Studio: the NetComposer instruments on one transport and one mixer." />
    <!-- The stored theme (System, Light or Dark; src/theme.ts) before first paint, so a dark Studio never flashes light. -->
    <script>
      try {
        var t = localStorage.getItem("netcomposer.studio.theme.v1");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-nc-theme", t);
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/studio/assets/index-CQAZPdyL.js"></script>
    <link rel="stylesheet" crossorigin href="/studio/assets/index-CJ-jcpyn.css">
    <link rel="stylesheet" href="/nc-ui/nc-ui.css" data-nc-ui-live="" onerror="this.onerror=null;var l=document.createElement(&#39;link&#39;);l.rel=&#39;stylesheet&#39;;l.href=&#39;/studio/nc-ui-fallback.css&#39;;l.dataset.ncUiFallback=&#39;&#39;;document.head.appendChild(l)">
  </head>
  <body>
    <!-- Painted before any script runs, so the page never sits blank: the title and the bar as the Studio draws them,
         Play waiting and the load's first words. boot() in src/main.ts replaces it (boot-status.ts). -->
    <div id="app">
      <h1 class="brand" aria-label="NetComposer Studio">
        <span aria-hidden="true">NetComposer<span class="brand-sep"> / </span>Studio</span>
      </h1>
      <header class="top">
        <div class="transport"><button type="button" class="btn play" disabled>Play</button></div>
        <span class="status loading" role="status"
          ><span class="status-long">Loading the Studio…</span><span class="status-short">Loading</span></span
        >
      </header>
    </div>
  </body>
</html>
